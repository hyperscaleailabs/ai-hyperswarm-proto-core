      stars: 51099
      license: MIT
      note: agent + data framework; retrieval and tool integration
    - rank: 5
      repo: OpenBMB/ChatDev
      stars: 33823
      license: Apache-2.0
      note: LLM-powered multi-agent software dev pipeline
    - rank: 6
      repo: assafelovic/gpt-researcher
      stars: 28641
