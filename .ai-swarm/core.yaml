# .ai-swarm/core.yaml
# Single source of truth for the ai-hyperswarm-proto-core mission.
# Read by the `hsai` orchestrator on every iteration. Human-editable.
schema_version: 1

identity:
  name: ai-hyperswarm-proto-core
  owner: hyperscaleailabs
  license: Apache-2.0
  visibility: public

mission: >
  Build a self-improving prototype core for AI swarms: a small, auditable
  harness that continuously studies the best open-source multi-agent / swarm
  projects and folds their proven practices back into itself.

vision: >
  A codebase that gets measurably better on its own - each iteration leaves
  behind a merged, tested change plus a written lesson - so that over time the
  repo becomes both a working swarm harness and a living body of knowledge about
  how to build one.

# What "better" means, in priority order. The orchestrator reasons about these
# when there is no ticket to pick up (loop step 4).
goals:
  - id: G1
    title: Learn from the top-10 AI swarm / multi-agent projects
    description: >
      Continuously extract and adapt best practices from the reference set
      below - not just from source code, but from commit history, CI/CD
      pipelines, issue history, and agent/harness design. Every improvement
      should trace back to something observed in the field.
  - id: G2
    title: Stay auditable and traceable end to end
    description: >
      Every change is a PR; every PR is linked to a ticket, records which model
      produced it, and carries a lesson learned (pass or fail).
  - id: G3
    title: Grow the knowledge base
    description: >
      Turn lessons into durable articles and periodic whitepapers, indexed as
      Maps of Content (MOCs), kept Obsidian-ready.
  - id: G4
    title: Improve the harness itself
    description: >
      Sharpen orchestration, model-selection, CI signal, and safety guardrails
      so the loop is faster, cheaper (in quota), and safer over time.

methodology:
  summary: >
    Ticket-driven, test-gated, single-writer-per-branch autonomous loop.
  principles:
    - Every change flows through a PR; main is never committed to directly.
    - No PR without an associated ticket (traceability).
    - No merge without a green CI check (correctness gate).
    - Every PR records the model used and a lesson learned - even on failure.
    - Learn from evidence: cite the reference project / artifact that inspired a change.
    - Prefer small, reversible steps over large speculative ones.
  loop:  # mirrors the hsai orchestrator; see src/hsai/orchestrator.py
    - step: 1
      name: sync-and-check
      action: create worktree, pull main, run CI, check status
    - step: 2
      name: heal
      when: ci_red
      action: file a priority ticket, self-assign, fix, PR (linked + model + lesson), merge on green
    - step: 3
      name: implement
      when: ci_green and backlog_has_tickets
      action: take highest-priority ticket, self-assign, implement, PR (linked + model + lesson), merge on green
    - step: 4
      name: self-improve
      when: ci_green and backlog_empty
      action: >
        explore the codebase, choose one improvement toward the goals (learning
        from the reference set), FILE a ticket for it first, then implement it
        like step 3.

execution:
  # The orchestrator drives Claude Code headless (`claude -p`) so all model usage
  # is billed against the Claude subscription quota. See constraints below.
  engine: claude-cli
  max_parallel: 3           # concurrent worktrees/workers. Start proven at 1, then ramp.
  ramp:
    proven_at: 1            # verify a single iteration before ramping
    target: 3
  default_branch: main
  worktrees_dir: .hsai/worktrees
  permission_mode: acceptEdits   # headless claude permission mode; see docs/ARCHITECTURE.md
  output_format: json            # `claude -p --output-format`: the structured envelope that
                                 # feeds the quota ledger + trajectory store. Set to `text`
                                 # to drop the flag if a CLI change ever breaks it.
  trajectory_retention_blocks: 8 # how many blocks of .hsai/traj/ to keep (0 = keep all)
  agent_timeout_seconds: 1200    # hard cap per claude -p worker so a hang cannot stall the loop
  ci_remote_timeout_seconds: 300 # how long to wait for a PR's remote CI to conclude
  ci_poll_interval_seconds: 10   # poll cadence while waiting for remote CI
  max_ticket_attempts: 2         # retries before a ticket is marked 'blocked' for humans

# Model-size selection is a first-class, LEARNED capability (see backlog).
# The orchestrator picks a tier per task; tiers map to `claude --model` aliases.
models:
  tiers:
    light:
      model: haiku
      use_for: [docs, formatting, trivial-edits, indexing, chores]
    standard:
      model: sonnet
      use_for: [feature, bugfix, tests, refactor-small]
    heavy:
      model: opus
      use_for: [architecture, hard-bug, large-refactor, design]
  default_tier: standard
  selection_strategy: heuristic-v1   # improved over time; tracked as a backlog skill

# Governance: the architect steering loop (three streams).
# Stream 1: steering  - DIRECTION.md + review briefs + /review-next sessions -> ADRs
# Stream 2: quality   - SDLC phases with evidence, enforced by CI + orchestrator guards
# Stream 3: scheduled - twice-daily cycles: synthesize -> implement block -> whitepaper
#                       -> persona articles -> review brief
governance:
  direction_doc: governance/DIRECTION.md
  adr_dir: docs/adr
  review_label: review
  reviews_per_day: 2

cycle:
  block_size: 5                # sequential implementations per half-day block
  sequential: true             # protect the local machine; no parallel workers in cycles
  backlog_low_watermark: 4     # run synthesis when fewer well-formed tickets than this
  whitepaper_per_block: true   # one whitepaper per block => two per day

synthesis:
  tier: heavy                  # substantial cross-project synthesis needs the big model
  timeout_seconds: 2400
  refs_per_cycle: 3            # rotating subset of the top-10 analyzed per cycle
  ideas_target: 10             # candidate ideas generated before reflection
  file_top: 3                  # tickets actually filed after critique + prioritization
  min_projects_combined: 3     # an idea must combine practices from >= N reference projects
  memory_max_chars: 3000       # hard cap on the "what this loop already tried" prompt section
  memory_closed_limit: 15      # recently-closed tickets folded into synthesis memory
  memory_max_lessons: 25       # knowledge-base lessons folded into synthesis memory
  duplicate_threshold: 0.6     # Jaccard token overlap above which a candidate is a duplicate
  adoption_max_chars: 2000     # hard cap on the "practices already adopted / in flight" section

# Quota/cost budget for one half-day block (subscription-only: purely local
# measurement, never a metered API call). The ledger aggregates each block's
# spend; this gate warns then halts NEW work when a ceiling is crossed. It never
# aborts an in-flight PR and never relaxes the green-merge / ticket / lesson
# invariants. Unset a ceiling to disable that dimension.
budget:
  max_heavy_iterations_per_block: 3   # heavy-tier (opus) runs before halting new work
  max_seconds_per_block: 5400         # cumulative wall-clock across the block (90 min)
  soft_ratio: 0.8                     # fraction of a ceiling that triggers a soft breach

# Independent review gate (see src/hsai/review.py). After local CI passes and
# BEFORE a PR is opened, a model on a DIFFERENT tier than the author reviews the
# branch diff against the ticket's acceptance criteria and answers with a fenced
# JSON verdict. An unparseable verdict is fail-closed (non-approving); a blocking
# verdict routes through the normal retry policy (attempts:N / blocked), never a
# new stall state. Set enabled: false to restore the pre-review flow.
review:
  enabled: true
  # Who reviews whom. Never maps a tier to itself: the author must not grade its
  # own work. Biased cheap on purpose - the gate runs on EVERY change, so a
  # heavy reviewer would spend the block's heavy budget on critique alone.
  tier_policy:
    heavy: standard
    standard: light
    light: standard
  max_blocking_findings: 5     # findings beyond this are elided from the verdict
  max_diff_chars: 20000        # hard ceiling on the diff handed to the reviewer
  timeout_seconds: 900         # cap per reviewer run so the gate cannot hang the loop

personas:                      # article targets generated from each whitepaper
  - id: cto
    audience: CTO level - business impact, risk posture, strategic direction
  - id: architect
    audience: Architect level - system design, tradeoffs, patterns adopted
  - id: devops
    audience: DevOps level - CI/CD, automation mechanics, operational lessons

publish:
  mode: atlas-pull             # agentic-atlas ingests our whitepapers via its own pipeline
  atlas_repo: hyperscaleailabs/agentic-atlas

constraints:
  # Hard rules the orchestrator enforces at runtime.
  subscription_only: true            # NEVER use the metered API.
  forbid_env:
    - ANTHROPIC_API_KEY              # unset/ignored before invoking claude -p
  never_commit_to_default_branch: true
  require_ticket_per_pr: true
  require_green_ci_to_merge: true
  require_lesson_per_pr: true

knowledge:
  root: knowledge                    # Obsidian vault content lives under the repo root
  lessons_dir: knowledge/lessons
  whitepapers_dir: knowledge/whitepapers
  reference_dir: knowledge/reference   # append-only field notes on the reference set
  mocs_dir: knowledge/MOCs
  templates_dir: knowledge/templates
  whitepaper_every_lessons: 10       # synthesize a whitepaper every N new lessons
  obsidian_ready: true               # wikilinks + committed .obsidian config
  # Lesson retrieval (see src/hsai/recall.py): the read half of the knowledge
  # base. A deterministic BM25 index over lessons + whitepapers + ADRs injects
  # the most relevant prior notes into every worker prompt. No model call, no
  # third-party dependency. Set enabled: false to restore pre-recall prompts.
  recall:
    enabled: true                    # inject 'Prior lessons from this repo' into prompts
    k: 3                             # max notes shown per prompt
    max_chars: 1200                  # hard ceiling on the injected text
    fail_weight: 1.6                 # score multiplier for outcome/fail notes
    kind_weight: 1.25                # score multiplier when kind/ matches the task

# Ranked snapshot pinned on 2026-07-25. Criteria: >= 10k stars, permissive
# license (MIT or Apache-2.0), quality README, relevance to swarm / multi-agent.
# Ranking = stars weighted toward swarm/multi-agent relevance. Refreshed by a
# periodic chore ticket rather than queried live on every run.
reference_set:
  criteria:
    min_stars: 10000
    licenses: [MIT, Apache-2.0]
    domain: [ai-swarm, multi-agent, autonomous-agents, agent-orchestration]
  learn_from: [source_code, commit_history, ci_cd, issue_history, harness_design, readme]
  snapshot_date: 2026-07-25
  top10:
