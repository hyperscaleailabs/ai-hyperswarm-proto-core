# Known exceptions for `hsai audit` (see docs/SDLC.md, "Post-merge evidence").
#
# Each entry documents ONE pre-invariant gap: something the audit gate would
# otherwise flag, that predates the check (or the code fix behind it) and is
# therefore not real drift. This list must not grow silently - a new entry
# needs a reason, and the goal is always zero: it exists so the gate can
# start green and stay honest about history, not so failures can be muted.
#
# Format: {check, target, reason}. `target` is check-specific:
#   - wikilinks:         "<relative-path>:<dangling-target>"
#   - orphans:            "<note-name>"
#   - moc_freshness:       "<path>"
#   - frontmatter:         "<relative-path>"
#   - lesson_ticket_pr:    "<lesson-note-name>"
#   - merged_prs_have_lessons / model_consistency: "<pr-number>"
#
# --- lesson_ticket_pr: `lesson.pr` was never recorded before this ticket ---
# (feat: end-to-end traceability and vault integrity audit) taught the
# orchestrator to write the merged PR number back into the lesson. Every
# lesson filed before that fix legitimately names no pull request; this is
# the one-time backfill for that gap, not an ongoing allowance.
