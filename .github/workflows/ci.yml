name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: SDLC evidence (PR body)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          echo "$PR_BODY" | grep -qiE 'closes #[0-9]+' || { echo "::error::PR body missing 'Closes #N' ticket link"; fail=1; }
          echo "$PR_BODY" | grep -qi '## Model used'    || { echo "::error::PR body missing '## Model used' section"; fail=1; }
          echo "$PR_BODY" | grep -qi '## Lesson learned' || { echo "::error::PR body missing '## Lesson learned' section"; fail=1; }
          exit $fail
