name: budget-soft-breach-demotes-the-selected-tier
description: >
  Wall-clock spend past the soft ratio (4500s of a 5400s ceiling) does not halt
  the block - it biases selection one tier cheaper. The same size:L ticket that
  selects heavy on an unspent block runs on standard here.
lesson: 2026-07-26-implement-feat-quota-cost-telemetry-ledger-with-a-warn-then-halt-per-block-budget-gate

remote_ci: SUCCESS

# 4500s >= 0.8 * 5400s (soft), and < 5400s (not yet hard).
ledger:
  - {iteration: 1, tier: standard, model: sonnet, wall_clock_seconds: 4500, outcome: merged}

issues:
  - number: 26
    title: "feat: add a widget helper"
    labels: ["priority:P2", "size:L"]
    body: |
      ## Problem
      The widget helper does not exist yet.

      ## Proposal
      Add a small widget helper and cover it with a test.

      ## Acceptance criteria
      - [ ] `widget()` returns a value
      - [ ] a test covers the new helper

      ## Verification plan
      - [ ] `pytest` passes

transcript:
  - cmd: [git, status]
    stdout: "?? src/hsai/widget.py\n"

expect:
  path: implement
  tier: standard
  guards: [budget_soft]
  outcome: merged
