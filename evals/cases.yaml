  - id: wellformed-acceptance-criteria-without-verification-plan-refused
    source: >
      docs/adr/0001 decision 2: feature/skill tickets need acceptance criteria
      (>= 2 checkboxes) AND a verification plan; one without the other is not
      implementable.
    probes:
      tickets.check_well_formed:
        title: "feat: surface the eval scorecard in the review brief"
        body: |
          ## Acceptance criteria
          - [ ] render_brief includes a one-line scorecard
          - [ ] a governance test covers it
        expect: "False"

