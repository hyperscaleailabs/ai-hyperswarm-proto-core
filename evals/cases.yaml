  # --- ledger.evaluate_budget: the warn-then-halt quota gate --------------------

  - id: budget-block-41335-hard-breach-on-the-heavy-ceiling
    source: >
      knowledge/ledger/iterations.jsonl block 41335: three heavy-tier records
      (iterations 4133501/02/03) totalling 3501.272s. core.yaml sets
      max_heavy_iterations_per_block: 3, so the block is at its heavy ceiling.
    probes:
      ledger.evaluate_budget:
        aggregate:
          block: 41335
          iterations: 3
          heavy_iterations: 3
          total_seconds: 3501.272
        expect: hard

  - id: budget-block-41339-stays-within-both-ceilings
    source: >
      knowledge/ledger/iterations.jsonl block 41339: two heavy-tier records
      (iterations 4133902/03) totalling 2820.0s - under 3 heavy runs and under
      5400s.
    probes:
      ledger.evaluate_budget:
        aggregate:
          block: 41339
          iterations: 2
          heavy_iterations: 2
          total_seconds: 2820.0
        expect: ok

  - id: budget-heavy-soft-band-is-unreachable-at-a-ceiling-of-three
    source: >
      core.yaml budget: max_heavy_iterations_per_block: 3, soft_ratio: 0.8. The
      soft band is [2.4, 3), which contains no integer - so the heavy dimension
      jumps straight from ok to hard and never demotes. Pinned here as a real
      property of the current configuration, observable in block 41339 (2 heavy
      runs, still "ok").
    probes:
      ledger.evaluate_budget:
        aggregate:
          block: 41339
          iterations: 2
          heavy_iterations: 2
          total_seconds: 0.0
        expect: ok

  - id: budget-soft-breach-on-the-wall-clock-ratio
    source: >
      Block 41335's three heavy iterations averaged 1167s (3501.272s / 3), so a
      fourth crosses 0.8 x max_seconds_per_block (0.8 x 5400 = 4320s) while the
      heavy count is still under its ceiling - the soft breach that biases
      selection one tier cheaper.
    probes:
      ledger.evaluate_budget:
        aggregate:
          block: 41335
          iterations: 4
          heavy_iterations: 1
          total_seconds: 4400.0
        expect: soft

  - id: budget-empty-ledger-never-gates
    source: >
      A block before its first record: knowledge/ledger/iterations.jsonl holds
      nothing for it, and ledger.evaluate_budget's contract is that unset
      ceilings disable that dimension - so an empty budget never gates.
    probes:
      ledger.evaluate_budget:
        aggregate:
          block: 41359
          iterations: 0
          heavy_iterations: 0
          total_seconds: 0.0
        budget: {}
        expect: ok
