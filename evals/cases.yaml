# evals/cases.yaml - the labeled decision-core benchmark.
#
# Every case is traceable to something that actually happened in this repo: a
# record in knowledge/ledger/iterations.jsonl, a lesson note under
# knowledge/lessons/, a merged ticket/PR, or docs/adr/0001. The `source` field
# names that artifact so any label can be audited back to evidence.
#
# Labeling rules (so a label is never just "whatever the code does today"):
#
#   models.select        The tier that DEMONSTRABLY delivered the work. A lesson
#                        note records both the model that ran (haiku=light,
#                        sonnet=standard, opus=heavy) and the outcome, so an
#                        outcome/pass run labels its own tier. Where the light
#                        tier failed on a code ticket, ADR-0001 raises the label
#                        one tier ("haiku is demoted to genuinely mechanical,
#                        narrow edits").
#                        Inputs mirror production: hsai.orchestrator builds its
#                        Task from the ticket title, body and labels only, and
#                        never sets est_files - so est_files stays at its
#                        default of 1. Lesson notes do not record the ticket's
#                        size label, so lesson-derived cases omit labels and
#                        therefore probe the keyword/structural scorer alone;
#                        the two `select-size-*` cases probe the label override
#                        against sources where the size IS verifiable.
#
#   everything else      The behaviour the module's own contract states, applied
#                        to a real title/ticket/ledger record.
#
# Run with `hsai eval`. tests/test_evals.py fails when a per-function accuracy
# drops below evals/baseline.json, so this file is a regression gate, not a
# report. Enforcement lives in pytest on purpose: workers may not add or edit
# .github/workflows (run_once reverts such diffs), so pytest is the only gate a
# self-improving worker can legitimately strengthen.

