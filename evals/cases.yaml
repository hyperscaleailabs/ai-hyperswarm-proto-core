  # --- tickets.check_well_formed: is this ticket implementable? -----------------

  - id: wellformed-structured-feat-ticket-accepted
    source: >
      The rendered body of the size:L ticket this suite ships under, produced by
      tickets.TicketSpec.render(): Acceptance criteria + Verification plan with
      checkboxes.
    probes:
      tickets.check_well_formed:
        title: "feat: hsai eval - a labeled decision-core benchmark with a committed baseline and a pytest regression gate"
        body: |
          ## Problem
          Every claim of learning in this harness is currently unmeasured.

          ## Proposal
          Add evals/cases.yaml, src/hsai/evals.py and a pytest baseline gate.

          ## Acceptance criteria
          - [ ] `evals/cases.yaml` contains >= 25 traceable cases
          - [ ] `hsai eval` prints a scorecard and exits non-zero on regression

          ## Verification plan
          - [ ] `pytest tests/test_evals.py` passes
          - [ ] `ruff check .` is clean
        expect: "True"

  - id: wellformed-vague-one-liner-refused
    source: >
      docs/adr/0001 context: "tickets were unstructured, so a trivial diff could
      'satisfy' them" - the decay the well-formedness gate was added to stop.
    probes:
      tickets.check_well_formed:
        title: "feat: make the loop better"
